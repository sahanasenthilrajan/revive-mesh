server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: revive-mesh-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/revive_mesh}
    username: ${DB_USER:revive_user}
    password: ${DB_PASSWORD:revive_password}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
