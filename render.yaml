services:
  - type: web
    name: revive-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: revive-postgres
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: revive-postgres
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: revive-postgres
          property: password
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: revive-redis
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: revive-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: revive-redis
          property: port
      - key: KAFKA_BOOTSTRAP_SERVERS
        value: revive-kafka-senthilsahana7-9456.h.aivencloud.com:10345
      - key: KAFKA_SECURITY_PROTOCOL
        value: SASL_SSL
      - key: KAFKA_SASL_MECHANISM
        value: SCRAM-SHA-256
      - key: KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM
        value: https
      - key: KAFKA_USERNAME
        sync: false
      - key: KAFKA_PASSWORD
        sync: false
      - key: INTELLIGENCE_SERVICE_URL
        fromService:
          type: web
          name: revive-intelligence
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: revive-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: SPRING_PROFILES_ACTIVE
        value: prod
    healthCheckPath: /actuator/health

  - type: web
    name: revive-intelligence
    runtime: docker
    plan: free
    dockerfilePath: ./intelligence/Dockerfile
    dockerContext: ./intelligence
    healthCheckPath: /health

  - type: web
    name: revive-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: revive-backend
          envVarKey: RENDER_EXTERNAL_URL

  - type: keyvalue
    name: revive-redis
    plan: free
    ipAllowList: []

databases:
  - name: revive-postgres
    plan: free
    databaseName: revive_mesh
    user: revive_user
