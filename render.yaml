services:
  - type: web
    name: revive-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: revive-postgres
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: revive-postgres
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: revive-postgres
          property: password
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: revive-redis
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: revive-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: revive-redis
          property: port
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: INTELLIGENCE_SERVICE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SPRING_PROFILES_ACTIVE
        value: prod
    healthCheckPath: /actuator/health

  - type: web
    name: revive-intelligence
    runtime: docker
    dockerfilePath: ./intelligence/Dockerfile
    dockerContext: ./intelligence
    healthCheckPath: /health

  - type: web
    name: revive-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false

  - type: keyvalue
    name: revive-redis
    ipAllowList: []

databases:
  - name: revive-postgres
    databaseName: revive_mesh
    user: revive_user
